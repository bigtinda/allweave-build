<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" width="1360" height="900" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1360" height="900" fill="#ffffff"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#111827">S5 · 压缩抽取：三个入口收成一个控制器</text>
  <text x="48" y="88" font-size="13" fill="#6b7280">改之前：触发、阈值、事件散在会话类里；改之后：一个 controller 单点发出四个事件。事件类型与阈值都不动。</text>

  <rect x="48" y="120" width="560" height="470" rx="14" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="152" font-size="15" font-weight="700" fill="#111827">修改前架构 · 压缩散在会话里</text>
  <text x="72" y="172" font-size="11.5" fill="#9ca3af">packages/coding-agent/src/core/agent-session.ts:767-3256 · compaction/compaction.ts</text>

  <rect x="72" y="188" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="212" font-size="13.5" font-weight="600" fill="#111827">触发：四处，各拼各的参数</text>
  <text x="90" y="233" font-size="11.5" fill="#6b7280">783 / 839 threshold，1884 / 2056 检查，2764 手动入口</text>

  <rect x="72" y="262" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="286" font-size="13.5" font-weight="600" fill="#111827">阈值：同一件事判定两次</text>
  <text x="90" y="307" font-size="11.5" fill="#6b7280">767 _exceedsCompactionThreshold 与 838 请求投影各算一次</text>

  <rect x="72" y="336" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="360" font-size="13.5" font-weight="600" fill="#111827">参数：十一个实参逐项透传</text>
  <text x="90" y="381" font-size="11.5" fill="#6b7280">2719-2742 传 sessionId=undefined，compact 已是 12 参</text>

  <rect x="72" y="410" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="434" font-size="13.5" font-weight="600" fill="#111827">事件：五处各发一次</text>
  <text x="90" y="455" font-size="11.5" fill="#6b7280">compaction_start 2767/3119，session_compact 2859/3189</text>

  <rect x="72" y="484" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="508" font-size="13.5" font-weight="600" fill="#111827">耦合：压缩先要 getBranch()</text>
  <text x="90" y="529" font-size="11.5" fill="#6b7280">prepareCompaction(872) 依赖会话投影，无法脱离会话单测</text>

  <line x1="628" y1="352" x2="700" y2="352" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="664" y="316" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">本阶段</text>
  <text x="664" y="334" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">抽控制器</text>
  <text x="664" y="380" font-size="10.5" fill="#9ca3af" text-anchor="middle">行为等价</text>

  <rect x="712" y="120" width="600" height="470" rx="14" fill="#f5f8ff" stroke="#bfd0f5" stroke-width="1.5"/>
  <text x="736" y="152" font-size="15" font-weight="700" fill="#111827">修改后架构 · 一个控制器，三个入口</text>
  <text x="736" y="172" font-size="11.5" fill="#7b8db3">新增：CompactionController + 事件单点发出 + docs/patches 记录上游改动</text>

  <rect x="736" y="188" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="212" font-size="13.5" font-weight="600" fill="#111827">入口：三个各剩 5–10 行</text>
  <text x="754" y="233" font-size="11.5" fill="#6b7280">收集 entries，调 controller.run(reason)，写回 CompactionResult</text>

  <rect x="736" y="262" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="286" font-size="13.5" font-weight="600" fill="#111827">判定：阈值只算一次</text>
  <text x="754" y="307" font-size="11.5" fill="#6b7280">reason 由 controller 决定，重复的阈值函数删除</text>

  <rect x="736" y="336" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="360" font-size="13.5" font-weight="600" fill="#111827">编排：prepare 与 compact 收进来</text>
  <text x="754" y="381" font-size="11.5" fill="#6b7280">prepareCompaction(872) 签名不变，作为内部纯函数保留</text>

  <rect x="736" y="410" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="434" font-size="13.5" font-weight="600" fill="#111827">事件：单点发出，序列冻结</text>
  <text x="754" y="455" font-size="11.5" fill="#6b7280">四个事件加一次 appendCompaction，fixture 逐字节比对</text>

  <rect x="736" y="484" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="508" font-size="13.5" font-weight="600" fill="#111827">上游：改动有据可查</text>
  <text x="754" y="529" font-size="11.5" fill="#6b7280">docs/patches/S5-compaction.patch + README 记基线 commit</text>

  <rect x="48" y="620" width="1264" height="238" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="652" font-size="15" font-weight="700" fill="#111827">与现状的差别</text>

  <text x="72" y="684" font-size="12.5" fill="#374151">1. 压缩从"会话类的私有方法"变成"可单独构造的控制器"：输入是 entries 与 settings，测试不用起 AgentSession。</text>
  <text x="72" y="710" font-size="12.5" fill="#374151">2. 事件只在一处发出，工作台不必为三条路径各写一份"压缩中"状态，恢复语义也不再随入口漂移。</text>
  <text x="72" y="736" font-size="12.5" fill="#374151">3. 上游改动以 patch 留档：升级 coding-agent 时可重放、可回退，diff 范围是可枚举的六个文件段。</text>

  <text x="72" y="778" font-size="12.5" font-weight="600" fill="#111827">关键约束</text>
  <text x="72" y="802" font-size="12" fill="#6b7280">· AgentSessionEvent 冻结，不新增字段；controller 复用现有类型。</text>
  <text x="72" y="824" font-size="12" fill="#6b7280">· 先等价后优化：本阶段不改触发阈值，也不改摘要文本。</text>
  <text x="72" y="846" font-size="12" fill="#6b7280">· 500 行是验收项，达不到写差额，不允许删功能凑数。</text>

  <text x="760" y="778" font-size="12.5" font-weight="600" fill="#111827">本阶段完成定义</text>
  <text x="760" y="802" font-size="12" fill="#6b7280">· 三条入口 fixture diff 为空，压缩测试全绿</text>
  <text x="760" y="824" font-size="12" fill="#6b7280">· agent-session.ts ≤ 3898 行，npm run check 0 error</text>
  <text x="760" y="846" font-size="12" fill="#6b7280">· docs/patches/S5-compaction.patch 与 README 就位</text>
</svg>
