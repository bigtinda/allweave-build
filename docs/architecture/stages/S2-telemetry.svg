<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" width="1360" height="900" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1360" height="900" fill="#ffffff"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#111827">S2 · 可观测与成本：让每次运行留下证据</text>
  <text x="48" y="88" font-size="13" fill="#6b7280">改之前：一次 run 只有一个 token 数字；改之后：每次 run 是一棵带成本与延迟的 span 树。不往内核里埋点。</text>

  <rect x="48" y="120" width="560" height="470" rx="14" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="152" font-size="15" font-weight="700" fill="#111827">修改前架构 · 一个 run 一个数字</text>
  <text x="72" y="172" font-size="11.5" fill="#9ca3af">sessions/run-usage.ts · sessions/coordinator.ts · store.ts</text>

  <rect x="72" y="188" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="212" font-size="13.5" font-weight="600" fill="#111827">只有计数器差值，没有时间维度</text>
  <text x="90" y="233" font-size="11.5" fill="#6b7280">run-usage.ts:6-17 usageDelta 前后相减，缺失即 undefined</text>

  <rect x="72" y="262" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="286" font-size="13.5" font-weight="600" fill="#111827">数据只在 run 结束时产生一次</text>
  <text x="90" y="307" font-size="11.5" fill="#6b7280">coordinator.ts:405-429 finally 里才组装 finishRunUsage</text>

  <rect x="72" y="336" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="360" font-size="13.5" font-weight="600" fill="#111827">没有观测用表</text>
  <text x="90" y="381" font-size="11.5" fill="#6b7280">store.ts:25-30 五张表里没有 run / span 的位置</text>

  <rect x="72" y="410" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="434" font-size="13.5" font-weight="600" fill="#111827">telemetry 包零引用</text>
  <text x="90" y="455" font-size="11.5" fill="#6b7280">packages/telemetry 有 startSpan 契约，apps/ 完全不 import</text>

  <rect x="72" y="484" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="508" font-size="13.5" font-weight="600" fill="#111827">前端只有会话级弹窗</text>
  <text x="90" y="529" font-size="11.5" fill="#6b7280">UsageSummary.tsx:5-21 · /api/usage 只有一个消费点</text>

  <line x1="628" y1="352" x2="700" y2="352" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="664" y="316" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">本阶段</text>
  <text x="664" y="334" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">加观测</text>
  <text x="664" y="380" font-size="10.5" fill="#9ca3af" text-anchor="middle">不进内核</text>

  <rect x="712" y="120" width="600" height="470" rx="14" fill="#f5f8ff" stroke="#bfd0f5" stroke-width="1.5"/>
  <text x="736" y="152" font-size="15" font-weight="700" fill="#111827">修改后架构 · 一次 run 一棵 span 树</text>
  <text x="736" y="172" font-size="11.5" fill="#7b8db3">新增：sessions/trace.ts + runs/spans 两表 + /api/usage 分位与成本</text>

  <rect x="736" y="188" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="212" font-size="13.5" font-weight="600" fill="#111827">trace.ts：run / turn / tool / model</text>
  <text x="754" y="233" font-size="11.5" fill="#6b7280">四层 span，父链由 span 栈维护，实现 TelemetryContext</text>

  <rect x="736" y="262" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="286" font-size="13.5" font-weight="600" fill="#111827">runs / spans 两表</text>
  <text x="754" y="307" font-size="11.5" fill="#6b7280">与投影同一个 withTransaction（store.ts:45-59）</text>

  <rect x="736" y="336" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="360" font-size="13.5" font-weight="600" fill="#111827">span 边界挂在已有事件流上</text>
  <text x="754" y="381" font-size="11.5" fill="#6b7280">coordinator.ts:387-443 开 run，emit() 里开关 tool span</text>

  <rect x="736" y="410" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="434" font-size="13.5" font-weight="600" fill="#111827">成本来自 calculateCost</text>
  <text x="754" y="455" font-size="11.5" fill="#6b7280">写入 runs.cost_usd；RunUsage.tokens.cost 保留为兼容字段</text>

  <rect x="736" y="484" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="508" font-size="13.5" font-weight="600" fill="#111827">PI_CONSOLE_TRACE 选 sink</text>
  <text x="754" y="529" font-size="11.5" fill="#6b7280">off = NOOP · memory = InMemoryTelemetryContext · file</text>

  <rect x="48" y="620" width="1264" height="238" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="652" font-size="15" font-weight="700" fill="#111827">与现状的差别</text>

  <text x="72" y="684" font-size="12.5" fill="#374151">1. 从"一次 run 一个数字"到"一次 run 一棵树"：成本、延迟、错误都能落到具体 turn 与工具调用上。</text>
  <text x="72" y="710" font-size="12.5" fill="#374151">2. 指标口径固定：分位与错误分类由服务端算一次，前端只读，避免每个页面各算一套。</text>
  <text x="72" y="736" font-size="12.5" fill="#374151">3. 观测与投影同库同事务：不再出现"会话状态有了、用量还没落盘"的中间态。</text>

  <text x="72" y="778" font-size="12.5" font-weight="600" fill="#111827">关键约束</text>
  <text x="72" y="802" font-size="12" fill="#6b7280">· 不在内核加埋点：只订阅既有事件，H1 事件联合保持冻结。</text>
  <text x="72" y="824" font-size="12" fill="#6b7280">· span 属性只允许低基数枚举与数字，禁止写入工具输入或文件内容。</text>
  <text x="72" y="846" font-size="12" fill="#6b7280">· 协议只加可选字段，旧的 /api/usage 消费端不改也能跑。</text>

  <text x="760" y="778" font-size="12.5" font-weight="600" fill="#111827">本阶段完成定义</text>
  <text x="760" y="802" font-size="12" fill="#6b7280">· 每个 run 恰好 1 个 run span，无孤儿 span</text>
  <text x="760" y="824" font-size="12" fill="#6b7280">· node scripts/check-cost-parity.mjs 偏差 &lt; 5%</text>
  <text x="760" y="846" font-size="12" fill="#6b7280">· PI_CONSOLE_TRACE=off 时行为与修改前一致</text>
</svg>
