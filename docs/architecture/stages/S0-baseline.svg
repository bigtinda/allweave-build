<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" width="1360" height="900" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1360" height="900" fill="#ffffff"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#111827">S0 · 基线固化：先有安全网</text>
  <text x="48" y="88" font-size="13" fill="#6b7280">改之前：没有可重复的失败信号，也没有指标；改之后：任何结构改动都能被测试与度量抓住。本阶段不改运行时行为。</text>

  <rect x="48" y="120" width="560" height="470" rx="14" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="152" font-size="15" font-weight="700" fill="#111827">修改前架构 · 无安全网</text>
  <text x="72" y="172" font-size="11.5" fill="#9ca3af">apps/server/test · scripts/check-*.mjs · 根 package.json</text>

  <rect x="72" y="188" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="212" font-size="13.5" font-weight="600" fill="#111827">测试门：不绿</text>
  <text x="90" y="233" font-size="11.5" fill="#6b7280">3 个已知失败，无干净基线可比</text>

  <rect x="72" y="262" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="286" font-size="13.5" font-weight="600" fill="#111827">任务级评测：无</text>
  <text x="90" y="307" font-size="11.5" fill="#6b7280">packages/evals 只有 harness，产品不调用</text>

  <rect x="72" y="336" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="360" font-size="13.5" font-weight="600" fill="#111827">指标：无</text>
  <text x="90" y="381" font-size="11.5" fill="#6b7280">成本 / 缓存命中 / 压缩次数不可见</text>

  <rect x="72" y="410" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="434" font-size="13.5" font-weight="600" fill="#111827">文档门禁：无</text>
  <text x="90" y="455" font-size="11.5" fill="#6b7280">34 处 Tauri、PI_CONSOLE_TOKEN 谎报无人拦</text>

  <rect x="72" y="484" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="508" font-size="13.5" font-weight="600" fill="#111827">回退开关：无</text>
  <text x="90" y="529" font-size="11.5" fill="#6b7280">后续阶段无法按层回退</text>

  <line x1="628" y1="352" x2="700" y2="352" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="664" y="316" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">本阶段</text>
  <text x="664" y="334" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">只加测量</text>
  <text x="664" y="380" font-size="10.5" fill="#9ca3af" text-anchor="middle">不改行为</text>

  <rect x="712" y="120" width="600" height="470" rx="14" fill="#f5f8ff" stroke="#bfd0f5" stroke-width="1.5"/>
  <text x="736" y="152" font-size="15" font-weight="700" fill="#111827">修改后架构 · 可度量的基线</text>
  <text x="736" y="172" font-size="11.5" fill="#7b8db3">新增：测试修复 + 20 golden traces + 8 指标 + 文档门禁 + flag 框架</text>

  <rect x="736" y="188" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="212" font-size="13.5" font-weight="600" fill="#111827">测试门：全绿，0 个无原因 skip</text>
  <text x="754" y="233" font-size="11.5" fill="#6b7280">修 3 个已知失败；skip 必须写原因与到期阶段</text>

  <rect x="736" y="262" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="286" font-size="13.5" font-weight="600" fill="#111827">golden traces：20 个任务</text>
  <text x="754" y="307" font-size="11.5" fill="#6b7280">faux provider 驱动，禁止真实 API key</text>

  <rect x="736" y="336" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="360" font-size="13.5" font-weight="600" fill="#111827">8 项指标 → baseline.json</text>
  <text x="754" y="381" font-size="11.5" fill="#6b7280">cost / cache / p95 / turns / error / compaction / hitl / pass@1</text>

  <rect x="736" y="410" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="434" font-size="13.5" font-weight="600" fill="#111827">文档一致性门禁：check 必跑</text>
  <text x="754" y="455" font-size="11.5" fill="#6b7280">路径存在、行号不越界、声明行数误差 ≤5%、链接有效</text>

  <rect x="736" y="484" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="508" font-size="13.5" font-weight="600" fill="#111827">PI_KERNEL_* 开关框架（默认全关）</text>
  <text x="754" y="529" font-size="11.5" fill="#6b7280">apps/server/src/kernel/flags.ts 是唯一读取点</text>

  <rect x="48" y="620" width="1264" height="238" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="652" font-size="15" font-weight="700" fill="#111827">与现状的差别</text>

  <text x="72" y="684" font-size="12.5" fill="#374151">1. 从"靠人点页面验证"变成"靠命令验证"：python 不需要，一条 npm run check 覆盖类型、风格、文档、指标 schema。</text>
  <text x="72" y="710" font-size="12.5" fill="#374151">2. golden traces 是后续 S5/S9 双轨对拍的唯一裁判：同一输入，pi 实现与自研实现必须产出可解释的差异。</text>
  <text x="72" y="736" font-size="12.5" fill="#374151">3. 指标先于优化：没有 baseline.json 的前后对比，不允许把"性能更好"写进任何阶段验收。</text>

  <text x="72" y="778" font-size="12.5" font-weight="600" fill="#111827">关键约束</text>
  <text x="72" y="802" font-size="12" fill="#6b7280">· 不改任何运行时行为；本阶段所有 commit 可单独 revert。</text>
  <text x="72" y="824" font-size="12" fill="#6b7280">· trace 与指标只能来自本机 faux provider，禁止外部 API 与付费 token。</text>
  <text x="72" y="846" font-size="12" fill="#6b7280">· skip 的测试在 S9 前必须清零，否则视为阶段未完成。</text>

  <text x="760" y="778" font-size="12.5" font-weight="600" fill="#111827">本阶段完成定义</text>
  <text x="760" y="802" font-size="12" fill="#6b7280">· 服务端/前端测试全绿  · node scripts/check-architecture-docs.mjs exit 0</text>
  <text x="760" y="824" font-size="12" fill="#6b7280">· npm run check 0 error  · baseline.json 8 项齐全且可复查</text>
  <text x="760" y="846" font-size="12" fill="#6b7280">· flags.ts 被至少一个后续阶段引用（S1 起）</text>
</svg>
