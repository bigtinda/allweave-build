<!-- 内核出口 -->
<text class="m" x="316" y="742">内核出口（进程外）：</text>
<text class="cm" x="420" y="742">JSONL 文件（.pi-console/sessions）　·　模型 provider HTTP/OAuth　·　MCP servers　·　SSH pi-env daemon　·　子进程（bash）</text>
<text class="cm" x="316" y="762">工作台侧第二权威：console.sqlite（事件日志 + 投影）—— 与 JSONL 无共同事务，重载时以 JSONL 重建、meta 合并 → 见 S3</text>

<!-- ============ 底部三栏 ============ -->
<rect class="box" x="24" y="792" width="450" height="196" rx="5"/>
<rect x="24" y="792" width="450" height="22" fill="#b91c1c" rx="5"/>
<text x="34" y="808" class="tag">三个硬约束（先冻结，再动实现）</text>
<text class="m" x="34" y="832">H1　AgentSessionEvent 联合类型是公开契约</text>
<text class="cm" x="42" y="848">agent-session.ts:196-237 · index.ts 导出 · 10 个测试依赖</text>
<text class="m" x="34" y="870">H2　工作台授权依赖 tool_call 同步返回 {block}</text>
<text class="cm" x="42" y="886">tool-factory.ts:110-127 · agent-session.ts:658-724</text>
<text class="m" x="34" y="908">H3　JSONL 是对话真相源，工作台只读</text>
<text class="cm" x="42" y="924">session-manager.ts:41,1079 · transcript.ts:31-88</text>
<text class="cm" x="34" y="950">违反任一条 → 工作台会话数据不可恢复；</text>
<text class="cm" x="34" y="966">所以 S0 先把它们写成测试，S1 才动接缝。</text>

<rect class="box" x="494" y="792" width="500" height="196" rx="5"/>
<rect x="494" y="792" width="500" height="22" fill="#c2410c" rx="5"/>
<text x="504" y="808" class="tag">五条耦合证据（为什么改不动）</text>
<text class="cm" x="504" y="832">① 两层循环：agent-core runLoop + _runAgentPrompt（1822-1851）</text>
<text class="cm" x="504" y="850">② 持久化在事件回调：_handleAgentEvent → appendMessage（1103/1144）</text>
<text class="cm" x="504" y="868">③ 压缩触发散在 4 处：776 / 838 / 905 / 1884</text>
<text class="cm" x="504" y="886">④ 扩展反向依赖：_bindExtensionCore 30 个回调（3360-3493）</text>
<text class="cm" x="504" y="904">⑤ 提示词 × 工具装载耦合：_preparePromptAndToolLoadout（1738）</text>
<text class="cm" x="504" y="928">→ 对应阶段：①→S9　②→S3　③→S4/S5　④→S7　⑤→S6</text>
<text class="cm" x="504" y="952">附：_queueSteer（2238）同时写 Agent.MessageQueue 与</text>
<text class="cm" x="504" y="968">_steeringMessages —— 两套队列，天然同步 bug 温床（S9 解决）</text>

<rect class="box" x="1014" y="792" width="402" height="196" rx="5"/>
<rect x="1014" y="792" width="402" height="22" fill="#475569" rx="5"/>
<text x="1024" y="808" class="tag">能换 / 不能换（决定阶段顺序）</text>
<text class="cm" x="1024" y="832">commodity：agent loop、pi-ai providers（可换，但语义被深度依赖）</text>
<text class="cm" x="1024" y="852">自研且可先拆：compaction（契约已是纯函数）→ S5</text>
<text class="cm" x="1024" y="870">自研需先抽象：extensions（API 面 = 会话面）→ S7</text>
<text class="cm" x="1024" y="888">自研不可整体换：AgentSession（只能逐块拆）</text>
<text class="cm" x="1024" y="906">跨层契约：SessionManager（改存储要同时改工作台）→ S3</text>
<text class="cm" x="1024" y="924">薄且干净：tools（operations 注入点）→ S6/S8</text>
<text class="cm" x="1024" y="946">表现层：modes/{interactive,print,rpc} + tui → 不需要拆，</text>
<text class="cm" x="1024" y="962">目标态里由 CLI surface 与会话协议替代</text>

</svg>
