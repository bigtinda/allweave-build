<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" width="1360" height="900" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1360" height="900" fill="#ffffff"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#111827">S3 · 持久化单一事实：让崩溃只丢最后一条</text>
  <text x="48" y="88" font-size="13" fill="#6b7280">改之前：快照与事件日志两份权威；改之后：一条 append-only 日志，快照降为可重建投影。JSONL 写入方不动。</text>

  <rect x="48" y="120" width="560" height="470" rx="14" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="152" font-size="15" font-weight="700" fill="#111827">修改前架构 · 快照即主数据</text>
  <text x="72" y="172" font-size="11.5" fill="#9ca3af">sessions/event-projector.ts · store.ts · coordinator.ts</text>

  <rect x="72" y="188" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="212" font-size="13.5" font-weight="600" fill="#111827">快照是主数据</text>
  <text x="90" y="233" font-size="11.5" fill="#6b7280">store.ts:25-30 sessions.data 存整份 SessionDetail 的 gzip</text>

  <rect x="72" y="262" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="286" font-size="13.5" font-weight="600" fill="#111827">每个非 delta 事件写全量</text>
  <text x="90" y="307" font-size="11.5" fill="#6b7280">event-projector.ts:342-350 只有流式更新才走增量</text>

  <rect x="72" y="336" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="360" font-size="13.5" font-weight="600" fill="#111827">写入有 1 秒窗</text>
  <text x="90" y="381" font-size="11.5" fill="#6b7280">store.ts:179-189 saveSession 用 defer 合并写</text>

  <rect x="72" y="410" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="434" font-size="13.5" font-weight="600" fill="#111827">in-flight 状态只在内存</text>
  <text x="90" y="455" font-size="11.5" fill="#6b7280">coordinator.ts:58-68 · tool-authorization.ts:39 的 Map</text>

  <rect x="72" y="484" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="508" font-size="13.5" font-weight="600" fill="#111827">重启即失忆</text>
  <text x="90" y="529" font-size="11.5" fill="#6b7280">event-projector.ts:68-76 状态直接改 idle，不发事件</text>

  <line x1="628" y1="352" x2="700" y2="352" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="664" y="316" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">本阶段</text>
  <text x="664" y="334" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">换存储</text>
  <text x="664" y="380" font-size="10.5" fill="#9ca3af" text-anchor="middle">先双写再切读</text>

  <rect x="712" y="120" width="600" height="470" rx="14" fill="#f5f8ff" stroke="#bfd0f5" stroke-width="1.5"/>
  <text x="736" y="152" font-size="15" font-weight="700" fill="#111827">修改后架构 · 日志唯一写者</text>
  <text x="736" y="172" font-size="11.5" fill="#7b8db3">新增：session_events / running_runs / approvals + checkpoint 与 replay</text>

  <rect x="736" y="188" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="212" font-size="13.5" font-weight="600" fill="#111827">session_events 是 append-only</text>
  <text x="754" y="233" font-size="11.5" fill="#6b7280">project() 是唯一写者，旧 events 表删除</text>

  <rect x="736" y="262" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="286" font-size="13.5" font-weight="600" fill="#111827">每 50 条或 turn 边界 checkpoint</text>
  <text x="754" y="307" font-size="11.5" fill="#6b7280">写 session_summaries；sessions.data 降为缓存</text>

  <rect x="736" y="336" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="360" font-size="13.5" font-weight="600" fill="#111827">running_runs / approvals 落库</text>
  <text x="754" y="381" font-size="11.5" fill="#6b7280">审批先写库再返回；写库失败即拒绝审批</text>

  <rect x="736" y="410" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="434" font-size="13.5" font-weight="600" fill="#111827">启动 replay + 补中断</text>
  <text x="754" y="455" font-size="11.5" fill="#6b7280">残留 run 补 RESTART_OUTPUT，再发 session.recovered</text>

  <rect x="736" y="484" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="508" font-size="13.5" font-weight="600" fill="#111827">PI_CONSOLE_PROJECTION 开关</text>
  <text x="754" y="529" font-size="11.5" fill="#6b7280">events 为默认；legacy 只读快照，保留一个版本</text>

  <rect x="48" y="620" width="1264" height="238" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="652" font-size="15" font-weight="700" fill="#111827">与现状的差别</text>

  <text x="72" y="684" font-size="12.5" fill="#374151">1. 从"快照 + 日志两份真相"到"一条 append-only 日志一份真相"：SQLite 快照变成可随时重建的投影。</text>
  <text x="72" y="710" font-size="12.5" fill="#374151">2. 崩溃后的状态可解释：不再静默把运行中改成空闲，而是补一条中断结果并广播 session.recovered。</text>
  <text x="72" y="736" font-size="12.5" fill="#374151">3. 写放大与事件条数脱钩：一次 append 代替一次全量 gzip 快照，流式越长优势越大。</text>

  <text x="72" y="778" font-size="12.5" font-weight="600" fill="#111827">关键约束</text>
  <text x="72" y="802" font-size="12" fill="#6b7280">· 唯一写者：除 EventProjector.project() 外，任何模块不得直接写 session_events。</text>
  <text x="72" y="824" font-size="12" fill="#6b7280">· JSONL 仍是对话真相源（H3），本阶段不改它的写入方。</text>
  <text x="72" y="846" font-size="12" fill="#6b7280">· 表结构只增不删；legacy 档必须能打开同一份库并回放出相同结果。</text>

  <text x="760" y="778" font-size="12.5" font-weight="600" fill="#111827">本阶段完成定义</text>
  <text x="760" y="802" font-size="12" fill="#6b7280">· kill -9 后恢复率 100%，无 running 悬挂</text>
  <text x="760" y="824" font-size="12" fill="#6b7280">· fullSnapshotWrites ≤ 1，WAL 字节降 ≥ 80%</text>
  <text x="760" y="846" font-size="12" fill="#6b7280">· 1002 次 delta 回放与内存投影逐字段相等</text>
</svg>
