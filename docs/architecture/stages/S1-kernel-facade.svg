<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" width="1360" height="900" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1360" height="900" fill="#ffffff"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#111827">S1 · 内核门面：把内核收进一个出口</text>
  <text x="48" y="88" font-size="13" fill="#6b7280">改之前：12 个文件各自直连 5 个包；改之后：只有 kernel/ 认识内核。本阶段只搬 import 边界，不改任何运行时行为。</text>

  <rect x="48" y="120" width="560" height="470" rx="14" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="152" font-size="15" font-weight="700" fill="#111827">修改前架构 · 12 个文件直连内核</text>
  <text x="72" y="172" font-size="11.5" fill="#9ca3af">apps/server/src · 5 个包 · 26 个符号 · 33 处引用</text>

  <rect x="72" y="188" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="212" font-size="13.5" font-weight="600" fill="#111827">引用点分散：12 个文件</text>
  <text x="90" y="233" font-size="11.5" fill="#6b7280">sessions/ · workspaces/ · bootstrap/ · persistence/ 各存一份内核面</text>

  <rect x="72" y="262" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="286" font-size="13.5" font-weight="600" fill="#111827">深路径穿透</text>
  <text x="90" y="307" font-size="11.5" fill="#6b7280">pi-runtime.adapter.ts:3 → pi-ai/utils/model-operations</text>

  <rect x="72" y="336" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="360" font-size="13.5" font-weight="600" fill="#111827">类型擦除后强转</text>
  <text x="90" y="381" font-size="11.5" fill="#6b7280">tool-factory.ts:59-78 三处 as unknown as ToolDefinition</text>

  <rect x="72" y="410" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="434" font-size="13.5" font-weight="600" fill="#111827">依赖未声明：靠 hoist 解析</text>
  <text x="90" y="455" font-size="11.5" fill="#6b7280">chord（workspace-access.ts:4）· pi-agent-core（pi-events.ts:2）</text>

  <rect x="72" y="484" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="508" font-size="13.5" font-weight="600" fill="#111827">kernel 名字被占，但门面不存在</text>
  <text x="90" y="529" font-size="11.5" fill="#6b7280">apps/server/src/kernel.ts 只是 65 行 cordis host 辅助</text>

  <line x1="628" y1="352" x2="700" y2="352" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="664" y="316" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">本阶段</text>
  <text x="664" y="334" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">搬边界</text>
  <text x="664" y="380" font-size="10.5" fill="#9ca3af" text-anchor="middle">零行为变化</text>

  <rect x="712" y="120" width="600" height="470" rx="14" fill="#f5f8ff" stroke="#bfd0f5" stroke-width="1.5"/>
  <text x="736" y="152" font-size="15" font-weight="700" fill="#111827">修改后架构 · 一个目录定义内核面</text>
  <text x="736" y="172" font-size="11.5" fill="#7b8db3">新增：kernel/{index,sdk,models,tools,events,env,extensions}.ts + 边界门禁</text>

  <rect x="736" y="188" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="212" font-size="13.5" font-weight="600" fill="#111827">kernel/index.ts 是唯一出口</text>
  <text x="754" y="233" font-size="11.5" fill="#6b7280">sdk · models · tools · events · env · extensions 六个面汇总</text>

  <rect x="736" y="262" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="286" font-size="13.5" font-weight="600" fill="#111827">门面只做重导出</text>
  <text x="754" y="307" font-size="11.5" fill="#6b7280">不含业务逻辑；符号逐个列出，不用 export *</text>

  <rect x="736" y="336" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="360" font-size="13.5" font-weight="600" fill="#111827">深路径消失</text>
  <text x="754" y="381" font-size="11.5" fill="#6b7280">isModelType 走 pi-ai 公开入口，与 providers.ts:4 一致</text>

  <rect x="736" y="410" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="434" font-size="13.5" font-weight="600" fill="#111827">强转收敛成一个函数</text>
  <text x="754" y="455" font-size="11.5" fill="#6b7280">toToolDefinition() 是唯一保留 as unknown 的地方</text>

  <rect x="736" y="484" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="508" font-size="13.5" font-weight="600" fill="#111827">check-kernel-boundaries.mjs</text>
  <text x="754" y="529" font-size="11.5" fill="#6b7280">越界即 check 失败；依赖声明一并校验</text>

  <rect x="48" y="620" width="1264" height="238" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="652" font-size="15" font-weight="700" fill="#111827">与现状的差别</text>

  <text x="72" y="684" font-size="12.5" fill="#374151">1. 从"12 个文件各自记住内核长什么样"到"一个目录定义内核长什么样"：包改名、符号搬家只改 kernel/。</text>
  <text x="72" y="710" font-size="12.5" fill="#374151">2. 门面是替换内核的落点：S9 换实现时改的是 index.ts 的转发目标，不是 33 处调用点。</text>
  <text x="72" y="736" font-size="12.5" fill="#374151">3. 边界从"约定"变成"命令"：grep 与门禁脚本让越界在 check 里失败，而不是在 review 里被漏掉。</text>

  <text x="72" y="778" font-size="12.5" font-weight="600" fill="#111827">关键约束</text>
  <text x="72" y="802" font-size="12" fill="#6b7280">· 门面只允许 import 与重导出，唯一例外是 extensions.ts（原 kernel.ts 原样搬运）。</text>
  <text x="72" y="824" font-size="12" fill="#6b7280">· 零行为变化：import 边界清零与既有测试全绿必须同时成立，缺一不算完成。</text>
  <text x="72" y="846" font-size="12" fill="#6b7280">· 只约束 apps/server/src；test/ 下 10 个直连内核的测试文件本阶段不动。</text>

  <text x="760" y="778" font-size="12.5" font-weight="600" fill="#111827">本阶段完成定义</text>
  <text x="760" y="802" font-size="12" fill="#6b7280">· grep 结果为 0 · node scripts/check-kernel-boundaries.mjs exit 0</text>
  <text x="760" y="824" font-size="12" fill="#6b7280">· npm run check 0 error · 门禁脚本已并入根 check</text>
  <text x="760" y="846" font-size="12" fill="#6b7280">· adapter/kernel/tool-policy/workbench-smoke 四个测试文件全绿</text>
</svg>
