<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" width="1360" height="900" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1360" height="900" fill="#ffffff"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#111827">S8 · 执行隔离：授权不等于隔离</text>
  <text x="48" y="88" font-size="13" fill="#6b7280">改之前：bash 没有默认超时，子进程就是 server 进程；改之后：默认超时 + 进程树归属 + 路径前置校验。不做容器。</text>

  <rect x="48" y="120" width="560" height="470" rx="14" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="152" font-size="15" font-weight="700" fill="#111827">修改前架构 · 命令裸奔</text>
  <text x="72" y="172" font-size="11.5" fill="#9ca3af">core/tools/bash.ts · workspaces/command-operations.ts · security.ts</text>

  <rect x="72" y="188" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="212" font-size="13.5" font-weight="600" fill="#111827">超时：可选项，默认没有</text>
  <text x="90" y="233" font-size="11.5" fill="#6b7280">tools/bash.ts:42 的 schema 自己写着 no default timeout</text>

  <rect x="72" y="262" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="286" font-size="13.5" font-weight="600" fill="#111827">进程：就是 server 进程</text>
  <text x="90" y="307" font-size="11.5" fill="#6b7280">bash.ts:112 直接 spawn，Windows 上无 job 归属</text>

  <rect x="72" y="336" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="360" font-size="13.5" font-weight="600" fill="#111827">路径：只校验工具参数</text>
  <text x="90" y="381" font-size="11.5" fill="#6b7280">security.ts:51 只被文件工具与 HTTP 路由调用</text>

  <rect x="72" y="410" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="434" font-size="13.5" font-weight="600" fill="#111827">本地工作区放弃执行层</text>
  <text x="90" y="455" font-size="11.5" fill="#6b7280">command-operations.ts:17 返回 undefined，落回 SDK</text>

  <rect x="72" y="484" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="508" font-size="13.5" font-weight="600" fill="#111827">自述与现实不符</text>
  <text x="90" y="529" font-size="11.5" fill="#6b7280">create-app.ts:134-135 明写 No sandbox</text>

  <line x1="628" y1="352" x2="700" y2="352" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="664" y="316" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">本阶段</text>
  <text x="664" y="334" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">收执行面</text>
  <text x="664" y="380" font-size="10.5" fill="#9ca3af" text-anchor="middle">不改工具语法</text>

  <rect x="712" y="120" width="600" height="470" rx="14" fill="#f5f8ff" stroke="#bfd0f5" stroke-width="1.5"/>
  <text x="736" y="152" font-size="15" font-weight="700" fill="#111827">修改后架构 · 执行收进端口</text>
  <text x="736" y="172" font-size="11.5" fill="#7b8db3">新增：sandbox/policy.ts · exec.ts · job-object.ts · packages/kernel-sandbox</text>

  <rect x="736" y="188" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="212" font-size="13.5" font-weight="600" fill="#111827">默认超时 120s，可单次覆盖</text>
  <text x="754" y="233" font-size="11.5" fill="#6b7280">PI_CONSOLE_BASH_TIMEOUT_MS，错误仍是 timeout:</text>

  <rect x="736" y="262" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="286" font-size="13.5" font-weight="600" fill="#111827">进程树：Windows Job Object</text>
  <text x="754" y="307" font-size="11.5" fill="#6b7280">KILL_ON_JOB_CLOSE，加载失败降级 taskkill /T /F</text>

  <rect x="736" y="336" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="360" font-size="13.5" font-weight="600" fill="#111827">spawn 前校验 cwd 与 allowWrite</text>
  <text x="754" y="381" font-size="11.5" fill="#6b7280">越界返回 block:true 与理由，不抛异常</text>

  <rect x="736" y="410" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="434" font-size="13.5" font-weight="600" fill="#111827">输出预算 + spill 文件</text>
  <text x="754" y="455" font-size="11.5" fill="#6b7280">超 50KB 落 .pi-console/spill，返回体不超预算</text>

  <rect x="736" y="484" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="508" font-size="13.5" font-weight="600" fill="#111827">isolation 字段改为实测等级</text>
  <text x="754" y="529" font-size="11.5" fill="#6b7280">off / process / job，不再写自述文案</text>

  <rect x="48" y="620" width="1264" height="238" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="652" font-size="15" font-weight="700" fill="#111827">与现状的差别</text>

  <text x="72" y="684" font-size="12.5" fill="#374151">1. 审批回答“要不要跑”，沙箱回答“跑坏了能波及什么”：本阶段把后半个答案落到每一条命令上。</text>
  <text x="72" y="710" font-size="12.5" fill="#374151">2. 本地工作区不再落回 SDK 内建后端：command-operations.ts:17 的 undefined 分支删除，本地与远程走同一执行层。</text>
  <text x="72" y="736" font-size="12.5" fill="#374151">3. child_process 从散落各处收进 packages/kernel-sandbox，边界可被脚本机械检查，不再靠评审记得。</text>

  <text x="72" y="778" font-size="12.5" font-weight="600" fill="#111827">关键约束</text>
  <text x="72" y="802" font-size="12" fill="#6b7280">· Windows 只承诺超时 + Job Object；AppContainer 与容器只调研，不进验收。</text>
  <text x="72" y="824" font-size="12" fill="#6b7280">· 命令内部重定向（echo &gt; ../x）在 Node 层拦不住，属 OS 隔离范畴，不承诺。</text>
  <text x="72" y="846" font-size="12" fill="#6b7280">· 双平台各跑一次：detached 在 Windows 不生效，kill 语义必须分开验证。</text>

  <text x="760" y="778" font-size="12.5" font-weight="600" fill="#111827">本阶段完成定义</text>
  <text x="760" y="802" font-size="12" fill="#6b7280">· 300ms 超时用例 100% 被 kill，错误文本可解析</text>
  <text x="760" y="824" font-size="12" fill="#6b7280">· 经 API 的越界路径 100% 拒绝；spill 文件可完整回读</text>
  <text x="760" y="846" font-size="12" fill="#6b7280">· PI_KERNEL_SANDBOX=off 回退演练一次并记录</text>
</svg>
