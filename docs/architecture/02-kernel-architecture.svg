<text class="title" x="24" y="36">02 内核架构（当前）· pi kernel 的内部形状与接缝</text>
<text class="sub" x="24" y="56">基线 codex/v1 工作树（v1.1.6 后重核） · 2026-11-03 · 证据：docs/audit/kernel-map.md（行号均为实测）；红=耦合热点，橙=第一拆解目标</text>

<!-- ============ 左列：L1 工作台 / L2 接缝 ============ -->
<rect class="box" x="24" y="72" width="252" height="176" rx="5"/>
<rect x="24" y="72" width="252" height="22" fill="#15803d" rx="5"/>
<text x="34" y="88" class="tag">L1 工作台 apps/server（12 个文件）</text>
<text class="m" x="34" y="112">sessions/pi-runtime.adapter.ts　接缝最重</text>
<text class="m" x="34" y="130">sessions/tool-factory.ts　工具定义/授权</text>
<text class="m" x="34" y="148">workspaces/workspace-access.ts　文件访问</text>
<text class="m" x="34" y="166">sessions/{coordinator,pi-events}.ts</text>
<text class="m" x="34" y="184">providers.ts · browser.ts · packages.ts</text>
<text class="m" x="34" y="202">kernel.ts（自装 cordis host 扩展）· 等</text>
<text class="m" x="34" y="226">共 33 处引用，分散在 12 个文件——</text>
<text class="m" x="34" y="242">没有任何一个文件叫"内核"</text>

<rect class="box" x="24" y="258" width="252" height="236" rx="5" stroke="#0369a1"/>
<rect x="24" y="258" width="252" height="22" fill="#0369a1" rx="5"/>
<text x="34" y="274" class="tag">L2 SDK 接缝（编译期直连源码）</text>
<text class="k" x="34" y="298">5 个包 × 12 文件 × 26 符号 × 33 处</text>
<text class="m" x="34" y="318">工厂：createAgentSession</text>
<text class="m" x="34" y="336">零件：ModelRuntime · SettingsManager</text>
<text class="m" x="34" y="352">　　　DefaultResourceLoader · SessionManager</text>
<text class="m" x="34" y="370">工具：create*ToolDefinition + operations</text>
<text class="m" x="34" y="388">函数：withFileMutationQueue · mime 探测</text>
<text class="m" x="34" y="406">扩展：codemode · tool-search · mcp 工厂</text>
<text class="m" x="34" y="430">四个"漏点"：</text>
<text class="cm" x="42" y="448">1. barrel（index.ts 495 行）全量导出</text>
<text class="cm" x="42" y="464">2. 深路径 import pi-ai/utils/*</text>
<text class="cm" x="42" y="480">3. agent-core/chord 未声明依赖</text>

<rect class="box" x="24" y="504" width="252" height="72" rx="5"/>
<text class="k" x="34" y="524">为什么先收口（S1）</text>
<text class="m" x="34" y="542">不改它，任何内核改动要同时改 12 个文件；</text>
<text class="m" x="34" y="558">收口后 = 单一门面，替换只改门面。</text>

<!-- ============ 内核大框 ============ -->
<rect class="kb" x="300" y="72" width="1116" height="704" rx="8"/>
<rect x="300" y="72" width="1116" height="26" fill="#1d4ed8" rx="8"/>
<text x="316" y="90" class="tag">L3 PI KERNEL　packages/*　当下形状：一个 4398 行的类 + 一堆配套</text>

<!-- 表现层 -->
<text class="m" x="316" y="118">表现层（与内核同仓同 barrel；工作台只用进程内 SDK，不经过 RPC）</text>
<rect class="cell" x="316" y="124" width="330" height="40" rx="4"/>
<text class="cm" x="326" y="140">modes/interactive　7.1k 行（TUI 交互）</text>
<text class="cm" x="326" y="156">modes/rpc　819 行 / 35 命令（JSONL over stdio）</text>
<rect class="cell" x="654" y="124" width="240" height="40" rx="4"/>
<text class="cm" x="664" y="140">modes/print　169 行（--print）</text>
<text class="cm" x="664" y="156">tui · chord（experimental 运行时）</text>
<rect class="cell" x="902" y="124" width="498" height="40" rx="4"/>
<text class="cm" x="912" y="140">SDK 组合：sdk.ts 487 · agent-session-runtime · agent-session-services</text>
<text class="cm" x="912" y="156">setDefaultStreamFn(streamSimple) 在 sdk.ts:46 → pi-ai 网关</text>

<!-- AgentSession -->
<rect x="316" y="176" width="1084" height="430" fill="#ffffff" stroke="#475569" stroke-width="1.6" rx="6"/>
<rect x="316" y="176" width="1084" height="24" fill="#334155" rx="6"/>
<text x="328" y="193" class="tag">AgentSession · packages/coding-agent/src/core/agent-session.ts · 4398 行 · 18 个职责块 / 22 个行号区间</text>

<!-- 22 cells: 11 rows x 2 cols -->
<rect class="cool" x="328" y="208" width="524" height="30" rx="3"/><text class="cm" x="338" y="227">事件契约 AgentSessionEvent（196-237）← 硬约束 H1</text>
<rect class="cell" x="860" y="208" width="524" height="30" rx="3"/><text class="cm" x="870" y="227">配置与类型 + estimateMessagesTokens（246-364）</text>

<rect class="cell" x="328" y="242" width="524" height="30" rx="3"/><text class="cm" x="338" y="261">20+ 私有字段，按 6 组堆叠（378-483）</text>
<rect class="cell" x="860" y="242" width="524" height="30" rx="3"/><text class="cm" x="870" y="261">构造函数：装 6 个 agent 钩子（485-526）</text>

<rect class="cell" x="328" y="276" width="524" height="30" rx="3"/><text class="cm" x="338" y="295">模型鉴权 + 选择记录（528-651）</text>
<rect class="hot" x="860" y="276" width="524" height="30" rx="3"/><text class="cm" x="870" y="295">工具拦截 + 嵌套工具（652-764）← 审批边界 H2</text>

<rect class="warm" x="328" y="310" width="524" height="30" rx="3"/><text class="cm" x="338" y="329">请求投影 + 压缩阈值 + 虚拟模型（767-844）</text>
<rect class="cell" x="860" y="310" width="524" height="30" rx="3"/><text class="cm" x="870" y="329">边界生命周期：turn_end / before settle（846-932）</text>

<rect class="cell" x="328" y="344" width="524" height="30" rx="3"/><text class="cm" x="338" y="363">事件发射 + 边界草稿写 SessionManager（934-1100）</text>
<rect class="hot" x="860" y="344" width="524" height="30" rx="3"/><text class="cm" x="870" y="363">agent 事件 → 持久化（1103-1281）← 从回调里长存储</text>

<rect class="cell" x="328" y="378" width="524" height="30" rx="3"/><text class="cm" x="338" y="397">agent 事件 → 扩展钩子映射（1284-1362）</text>
<rect class="cell" x="860" y="378" width="524" height="30" rx="3"/><text class="cm" x="870" y="397">subscribe / dispose 生命周期（1369-1414）</text>

<rect class="cell" x="328" y="412" width="524" height="30" rx="3"/><text class="cm" x="338" y="431">工具装载 + 系统提示重建（1416-1813）</text>
<rect class="hot" x="860" y="412" width="524" height="30" rx="3"/><text class="cm" x="870" y="431">Prompting：外层二次循环（1818-2451）← 两层循环</text>

<rect class="cell" x="328" y="446" width="524" height="30" rx="3"/><text class="cm" x="338" y="465">模型切换 / cycleModel（2453-2600）</text>
<rect class="cell" x="860" y="446" width="524" height="30" rx="3"/><text class="cm" x="870" y="465">thinking level + 队列模式（2602-2712）</text>

<rect class="warm" x="328" y="480" width="524" height="30" rx="3"/><text class="cm" x="338" y="499">压缩三入口（2714-3256）← S5 第一拆解目标</text>
<rect class="hot" x="860" y="480" width="524" height="30" rx="3"/><text class="cm" x="870" y="499">扩展绑定：30 个回调交给 runner（3258-3700）</text>

<rect class="cell" x="328" y="514" width="524" height="30" rx="3"/><text class="cm" x="338" y="533">自动重试 / summarization 重试（3701-3827）</text>
<rect class="cell" x="860" y="514" width="524" height="30" rx="3"/><text class="cm" x="870" y="533">bash 执行（3828-3934）← 无默认超时</text>

<rect class="cell" x="328" y="548" width="524" height="30" rx="3"/><text class="cm" x="338" y="567">树导航 navigateTree / branch summary（3935-4160）</text>
<rect class="cell" x="860" y="548" width="524" height="30" rx="3"/><text class="cm" x="870" y="567">统计 / 导出 HTML·JSONL（4161-4336）← 表现层职责</text>

<text class="m" x="328" y="596">结论：它同时是状态机、持久化层、扩展宿主、提示词构建器、模型控制器、报告生成器。任何一块都改不动，因为全部共享字段与私有方法。</text>

