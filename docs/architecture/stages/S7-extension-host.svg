<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" width="1360" height="900" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1360" height="900" fill="#ffffff"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#111827">S7 · 扩展宿主与信任：把第三方代码关进笼子</text>
  <text x="48" y="88" font-size="13" fill="#6b7280">改之前：项目一打开就全信任，扩展直接拿到 30 个会话回调；改之后：显式信任 + 能力端口。本阶段不改工具语义与模型链路。</text>

  <rect x="48" y="120" width="560" height="470" rx="14" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="152" font-size="15" font-weight="700" fill="#111827">修改前架构 · 扩展即会话</text>
  <text x="72" y="172" font-size="11.5" fill="#9ca3af">sessions/pi-runtime.adapter.ts · kernel.ts · core/extensions/*</text>

  <rect x="72" y="188" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="212" font-size="13.5" font-weight="600" fill="#111827">信任：项目无条件受信</text>
  <text x="90" y="233" font-size="11.5" fill="#6b7280">pi-runtime.adapter.ts:313 直接 setProjectTrusted(true)</text>

  <rect x="72" y="262" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="286" font-size="13.5" font-weight="600" fill="#111827">执行：扩展与内核同进程</text>
  <text x="90" y="307" font-size="11.5" fill="#6b7280">extensions/loader.ts:576-581 jiti 原地 import</text>

  <rect x="72" y="336" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="360" font-size="13.5" font-weight="600" fill="#111827">能力：30 个回调等于会话本身</text>
  <text x="90" y="381" font-size="11.5" fill="#6b7280">agent-session.ts:3360-3493，含 :3428 setModel</text>

  <rect x="72" y="410" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="434" font-size="13.5" font-weight="600" fill="#111827">装载：四条通道，零记录</text>
  <text x="90" y="455" font-size="11.5" fill="#6b7280">bindExtensions / factories / paths / registerTool</text>

  <rect x="72" y="484" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="508" font-size="13.5" font-weight="600" fill="#111827">审计：谁批准了扩展，查不到</text>
  <text x="90" y="529" font-size="11.5" fill="#6b7280">kernel.ts:63 宿主自写 .mjs 再当扩展注入</text>

  <line x1="628" y1="352" x2="700" y2="352" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="664" y="316" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">本阶段</text>
  <text x="664" y="334" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">加信任门</text>
  <text x="664" y="380" font-size="10.5" fill="#9ca3af" text-anchor="middle">不改钩子语义</text>

  <rect x="712" y="120" width="600" height="470" rx="14" fill="#f5f8ff" stroke="#bfd0f5" stroke-width="1.5"/>
  <text x="736" y="152" font-size="15" font-weight="700" fill="#111827">修改后架构 · 能力端口 + 显式信任</text>
  <text x="736" y="172" font-size="11.5" fill="#7b8db3">新增：extensions/trust.ts · host.ts · policy.ts · audit.ts · compat shim</text>

  <rect x="736" y="188" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="212" font-size="13.5" font-weight="600" fill="#111827">信任：清单加用户批准</text>
  <text x="754" y="233" font-size="11.5" fill="#6b7280">agentDir/trust.json，按路径哈希失效，默认拒绝</text>

  <rect x="736" y="262" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="286" font-size="13.5" font-weight="600" fill="#111827">宿主：ExtensionHost 端口</text>
  <text x="754" y="307" font-size="11.5" fill="#6b7280">discover / enable / grant / audit 四个动作</text>

  <rect x="736" y="336" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="360" font-size="13.5" font-weight="600" fill="#111827">能力：六类 capability</text>
  <text x="754" y="381" font-size="11.5" fill="#6b7280">fs.read fs.write bash model net session.write</text>

  <rect x="736" y="410" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="434" font-size="13.5" font-weight="600" fill="#111827">装载：单入口 + 版本化 shim</text>
  <text x="754" y="455" font-size="11.5" fill="#6b7280">kernel/extensions.ts 收口，PI_EXTENSION_API=1</text>

  <rect x="736" y="484" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="508" font-size="13.5" font-weight="600" fill="#111827">审计：每次装载一条事件</text>
  <text x="754" y="529" font-size="11.5" fill="#6b7280">extension_audit 写入 session_events 表</text>

  <rect x="48" y="620" width="1264" height="238" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="652" font-size="15" font-weight="700" fill="#111827">与现状的差别</text>

  <text x="72" y="684" font-size="12.5" fill="#374151">1. 扩展 API 不再等于会话 API：30 个回调收缩成 6 类能力，扩展拿不到 setModel 这类内核状态写入口。</text>
  <text x="72" y="710" font-size="12.5" fill="#374151">2. 信任从“目录里有什么就跑什么”变成“用户批准过什么才跑什么”，仓库自带的 4 个 .pi/extensions 不再克隆即执行。</text>
  <text x="72" y="736" font-size="12.5" fill="#374151">3. 四条装载通道收成一个入口，每次 load/grant/deny 都能回溯到谁、在哪个工作区、批准了什么。</text>

  <text x="72" y="778" font-size="12.5" font-weight="600" fill="#111827">关键约束</text>
  <text x="72" y="802" font-size="12" fill="#6b7280">· 不改 tool_call 同步 block 语义（H2），授权仍在内核前同步判定。</text>
  <text x="72" y="824" font-size="12" fill="#6b7280">· 上游 packages/coding-agent 只做调用点替换，改动记入 docs/patches/。</text>
  <text x="72" y="846" font-size="12" fill="#6b7280">· 未信任扩展必须“不加载”，而非“加载后限制”——后者在 Node 里做不到。</text>

  <text x="760" y="778" font-size="12.5" font-weight="600" fill="#111827">本阶段完成定义</text>
  <text x="760" y="802" font-size="12" fill="#6b7280">· 未信任仓库的 .pi/extensions 执行数 = 0</text>
  <text x="760" y="824" font-size="12" fill="#6b7280">· 黄金扩展集 5 个包兼容率 &gt;95%，npm run check 0 error</text>
  <text x="760" y="846" font-size="12" fill="#6b7280">· PI_KERNEL_EXT_TRUST=all 回退演练一次并记录</text>
</svg>
