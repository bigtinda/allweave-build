<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 900" width="1360" height="900" font-family="'Microsoft YaHei','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1360" height="900" fill="#ffffff"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#111827">S4 · 上下文预算：让 token 花在刀刃上</text>
  <text x="48" y="88" font-size="13" fill="#6b7280">改之前：估算有两套常量、压缩不用缓存、截断按行数；改之后：一份预算贯通判定、压缩与落盘。不改事件类型。</text>

  <rect x="48" y="120" width="560" height="470" rx="14" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="152" font-size="15" font-weight="700" fill="#111827">修改前架构 · 三处隐式预算</text>
  <text x="72" y="172" font-size="11.5" fill="#9ca3af">utils/estimate.ts · compaction/compaction.ts · tools/truncate.ts</text>

  <rect x="72" y="188" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="212" font-size="13.5" font-weight="600" fill="#111827">估算：两套常量并存</text>
  <text x="90" y="233" font-size="11.5" fill="#6b7280">estimate.ts:15 取 3.5；compaction.ts:311 起六处字面量 4</text>

  <rect x="72" y="262" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="286" font-size="13.5" font-weight="600" fill="#111827">口径：按 UTF-16 码元除常量</text>
  <text x="90" y="307" font-size="11.5" fill="#6b7280">中文一字算 0.29 token，实际约 1，中英混排低估 2–8 倍</text>

  <rect x="72" y="336" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="360" font-size="13.5" font-weight="600" fill="#111827">压缩请求：不继承父前缀</text>
  <text x="90" y="381" font-size="11.5" fill="#6b7280">compaction.ts:631 cacheRetention: none，632 另起 sessionId</text>

  <rect x="72" y="410" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="434" font-size="13.5" font-weight="600" fill="#111827">截断：2000 行 / 50KB 固定阈值</text>
  <text x="90" y="455" font-size="11.5" fill="#6b7280">truncate.ts:11-12；read/grep/ls/find 截断后无路径可回取</text>

  <rect x="72" y="484" width="512" height="62" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="90" y="508" font-size="13.5" font-weight="600" fill="#111827">预算：没有共同构造点</text>
  <text x="90" y="529" font-size="11.5" fill="#6b7280">窗口、reserveTokens、截断常量三处各说各话，无法一次打印</text>

  <line x1="628" y1="352" x2="700" y2="352" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="664" y="316" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">本阶段</text>
  <text x="664" y="334" font-size="12" font-weight="600" fill="#002FA7" text-anchor="middle">统一预算</text>
  <text x="664" y="380" font-size="10.5" fill="#9ca3af" text-anchor="middle">不改事件</text>

  <rect x="712" y="120" width="600" height="470" rx="14" fill="#f5f8ff" stroke="#bfd0f5" stroke-width="1.5"/>
  <text x="736" y="152" font-size="15" font-weight="700" fill="#111827">修改后架构 · 一份预算，三处共用</text>
  <text x="736" y="172" font-size="11.5" fill="#7b8db3">新增：CJK 感知估算 + ContextBudget + 压缩保留父前缀 + 结果 spill 到文件</text>

  <rect x="736" y="188" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="212" font-size="13.5" font-weight="600" fill="#111827">估算：按字符类分别计权</text>
  <text x="754" y="233" font-size="11.5" fill="#6b7280">新增 token-estimate.ts，20 段仓库语料误差 ≤15%</text>

  <rect x="736" y="262" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="286" font-size="13.5" font-weight="600" fill="#111827">入口唯一：旧签名转调新实现</text>
  <text x="754" y="307" font-size="11.5" fill="#6b7280">estimate.ts 导出不变；compaction.ts 六处字面量 4 全部删除</text>

  <rect x="736" y="336" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="360" font-size="13.5" font-weight="600" fill="#111827">压缩请求：复用父会话前缀</text>
  <text x="754" y="381" font-size="11.5" fill="#6b7280">cacheRetention 随设置，sessionId 用父会话 id，不支持时降级</text>

  <rect x="736" y="410" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="434" font-size="13.5" font-weight="600" fill="#111827">截断：按 token 预算而非行数</text>
  <text x="754" y="455" font-size="11.5" fill="#6b7280">truncate.ts 增 maxTokens，五个工具共用同一闸门</text>

  <rect x="736" y="484" width="552" height="62" rx="9" fill="#ffffff" stroke="#bfd0f5"/>
  <text x="754" y="508" font-size="13.5" font-weight="600" fill="#111827">超限结果：落盘并给回取路径</text>
  <text x="754" y="529" font-size="11.5" fill="#6b7280">spillTo 写临时文件，返回 spillPath，模型可再读</text>

  <rect x="48" y="620" width="1264" height="238" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="72" y="652" font-size="15" font-weight="700" fill="#111827">与现状的差别</text>

  <text x="72" y="684" font-size="12.5" fill="#374151">1. 低估从"多花钱"变成"判错"：shouldCompact 在真实占用接近窗口时仍返回 false，请求被拒后才走 overflow 恢复。</text>
  <text x="72" y="710" font-size="12.5" fill="#374151">2. 摘要请求不再每次重付全量输入价，cache hit rate 从不可解释变成可对比的指标。</text>
  <text x="72" y="736" font-size="12.5" fill="#374151">3. 截断从"丢内容"变成"给路径"，模型不必重跑更窄的查询，turns per task 才有下降空间。</text>

  <text x="72" y="778" font-size="12.5" font-weight="600" fill="#111827">关键约束</text>
  <text x="72" y="802" font-size="12" fill="#6b7280">· 不改 AgentSessionEvent，不新增事件；预算只改判定输入。</text>
  <text x="72" y="824" font-size="12" fill="#6b7280">· 15% 是目标值；语料不足按 25% 记录，不得写成达标。</text>
  <text x="72" y="846" font-size="12" fill="#6b7280">· 回退只切一个环境变量，旧估算实现保留到 S9 之后。</text>

  <text x="760" y="778" font-size="12.5" font-weight="600" fill="#111827">本阶段完成定义</text>
  <text x="760" y="802" font-size="12" fill="#6b7280">· npm run check 0 error  · token-estimate 误差 ≤15%</text>
  <text x="760" y="824" font-size="12" fill="#6b7280">· compaction 与 suite 压缩测试全绿，事件序列不变</text>
  <text x="760" y="846" font-size="12" fill="#6b7280">· tool result size p95 降 ≥30%，写进 04-roadmap §3</text>
</svg>
